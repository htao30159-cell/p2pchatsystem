<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .peer-id {
            font-size: 12px;
            opacity: 0.8;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .peer-controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .control-group {
            display: flex;
            gap: 8px;
        }

        .control-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
        }

        .control-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .control-group button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .peers-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .peers-header {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .peers-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .peer-item {
            padding: 14px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
        }

        .peer-item:hover {
            background: #e8eef7;
            transform: translateX(4px);
        }

        .peer-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .peer-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .peer-name {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
            word-break: break-all;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .chat-header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(to bottom, #f8f9fa, #ffffff);
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.other .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
            padding: 0 12px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            text-align: center;
            flex-direction: column;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .input-container {
            padding: 25px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            background: #ffffff;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>💬 P2P Chat</h1>
                <div class="peer-id" id="peerId">Connecting...</div>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>

            <div class="peer-controls">
                <div class="control-group">
                    <input type="text" id="peerInput" placeholder="Peer ID to connect" />
                    <button onclick="connectPeer()">Connect</button>
                </div>
            </div>

            <div class="peers-section">
                <div class="peers-header">Online Peers (<span id="peerCount">0</span>)</div>
                <div class="peers-list" id="peersList">
                    <div style="color: #999; text-align: center; padding: 20px;">No peers yet</div>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-dot"></div>
                <div class="chat-header-info">
                    <div class="chat-header-title" id="chatTitle">Welcome</div>
                    <div class="chat-header-subtitle" id="chatSubtitle">Select a peer to chat</div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">👋</div>
                    <div>Select a peer to start chatting</div>
                </div>
            </div>

            <div class="input-container hidden" id="inputContainer">
                <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." />
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        class P2PChat {
            constructor() {
                this.peerId = null;
                this.currentChat = null;
                this.peers = new Map();
                this.messages = new Map();
                this.socket = null;
                this.init();
            }

            init() {
                try {
                    this.socket = io();
                    this.setupSocketHandlers();
                } catch (err) {
                    console.error('Failed to initialize socket:', err);
                    this.setStatus('Connection Failed', false);
                }
            }

            setupSocketHandlers() {
                this.socket.on('connect', () => {
                    this.peerId = this.socket.id;
                    console.log('✅ Connected:', this.peerId);
                    document.getElementById('peerId').textContent = this.peerId;
                    this.setStatus('Connected', true);
                });

                this.socket.on('disconnect', () => {
                    console.log('❌ Disconnected');
                    this.setStatus('Disconnected', false);
                });

                this.socket.on('peer-connected', (data) => {
                    if (data.peerId !== this.peerId) {
                        this.addPeer(data.peerId);
                        console.log('👤 Peer joined:', data.peerId);
                    }
                    this.updatePeerCount(data.totalPeers);
                });

                this.socket.on('peer-disconnected', (data) => {
                    this.removePeer(data.peerId);
                    this.updatePeerCount(data.totalPeers);
                });

                this.socket.on('receive-message', (data) => {
                    this.handleMessage(data);
                });

                this.socket.on('error', (err) => {
                    console.error('Socket error:', err);
                });

                this.socket.on('connect_error', (err) => {
                    console.error('Connection error:', err);
                    this.setStatus('Connection Error', false);
                });
            }

            setStatus(text, connected) {
                document.getElementById('statusText').textContent = text;
                const dot = document.getElementById('statusDot');
                if (connected) {
                    dot.classList.add('connected');
                } else {
                    dot.classList.remove('connected');
                }
            }

            addPeer(peerId) {
                if (!this.peers.has(peerId)) {
                    this.peers.set(peerId, {});
                    this.messages.set(peerId, []);
                    this.renderPeers();
                }
            }

            removePeer(peerId) {
                this.peers.delete(peerId);
                if (this.currentChat === peerId) {
                    this.currentChat = null;
                    this.showEmptyState();
                }
                this.renderPeers();
            }

            updatePeerCount(count) {
                document.getElementById('peerCount').textContent = count - 1; // Exclude self
            }

            renderPeers() {
                const list = document.getElementById('peersList');
                const peers = Array.from(this.peers.keys()).filter(id => id !== this.peerId);

                if (peers.length === 0) {
                    list.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">No other peers</div>';
                    return;
                }

                list.innerHTML = peers.map(peerId => `
                    <div class="peer-item ${this.currentChat === peerId ? 'active' : ''}" onclick="chat.selectPeer('${peerId}')">
                        <div class="peer-status"></div>
                        <div class="peer-name">${peerId.substring(0, 12)}...</div>
                    </div>
                `).join('');
            }

            selectPeer(peerId) {
                this.currentChat = peerId;
                this.renderPeers();
                this.renderMessages();
                document.getElementById('chatTitle').textContent = peerId.substring(0, 12);
                document.getElementById('chatSubtitle').textContent = 'Connected';
                document.getElementById('inputContainer').classList.remove('hidden');
                document.getElementById('messageInput').focus();
            }

            sendMessage() {
                if (!this.currentChat) return;

                const input = document.getElementById('messageInput');
                const content = input.value.trim();

                if (!content) return;

                const message = {
                    from: this.peerId,
                    content,
                    timestamp: Date.now(),
                    own: true
                };

                this.messages.get(this.currentChat).push(message);
                this.socket.emit('send-message', {
                    to: this.currentChat,
                    from: this.peerId,
                    content,
                    timestamp: Date.now()
                });

                this.renderMessages();
                input.value = '';
            }

            handleMessage(data) {
                const from = data.from;
                if (!this.messages.has(from)) {
                    this.addPeer(from);
                }

                this.messages.get(from).push({
                    from,
                    content: data.content,
                    timestamp: data.timestamp,
                    own: false
                });

                if (this.currentChat === from) {
                    this.renderMessages();
                }
                this.renderPeers();
            }

            renderMessages() {
                const container = document.getElementById('messagesContainer');

                if (!this.currentChat) {
                    this.showEmptyState();
                    return;
                }

                const messages = this.messages.get(this.currentChat) || [];

                if (messages.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div>Start chatting!</div>';
                    return;
                }

                container.innerHTML = messages.map(msg => `
                    <div class="message ${msg.own ? 'own' : 'other'}">
                        <div>
                            <div class="message-bubble">${this.escapeHtml(msg.content)}</div>
                            <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                        </div>
                    </div>
                `).join('');

                container.scrollTop = container.scrollHeight;
            }

            showEmptyState() {
                document.getElementById('messagesContainer').innerHTML = '<div class=\"empty-state\"><div class=\"empty-state-icon\">👋</div>Select a peer</div>';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            connectPeer() {
                const peerId = document.getElementById('peerInput').value.trim();
                if (peerId) {
                    this.selectPeer(peerId);
                    document.getElementById('peerInput').value = '';
                }
            }
        }

        let chat;
        document.addEventListener('DOMContentLoaded', () => {
            chat = new P2PChat();
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    chat.sendMessage();
                }
            });
        });

        function sendMessage() {
            chat.sendMessage();
        }

        function connectPeer() {
            chat.connectPeer();
        }
    </script>
</body>
</html>
