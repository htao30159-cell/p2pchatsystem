<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .peer-id {
            font-size: 12px;
            opacity: 0.8;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .peer-controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .control-group {
            display: flex;
            gap: 8px;
        }

        .control-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .control-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .control-group button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .control-group button:active {
            transform: translateY(0);
        }

        /* Peers List */
        .peers-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .peers-header {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .peers-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .peer-item {
            padding: 14px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
        }

        .peer-item:hover {
            background: #e8eef7;
            transform: translateX(4px);
        }

        .peer-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .peer-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .peer-item.active .peer-status {
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .peer-name {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
            word-break: break-all;
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .chat-header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(to bottom, #f8f9fa, #ffffff);
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
            padding: 0 12px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            text-align: center;
            flex-direction: column;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Input Area */
        .input-container {
            padding: 25px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            background: #ffffff;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        /* Status indicators */
        .status {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 10px 20px 0;
            text-align: center;
        }

        .status.connecting {
            background: #fef3c7;
            color: #92400e;
        }

        .status.connected {
            background: #dcfce7;
            color: #15803d;
        }

        .status.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
            }

            .chat-container {
                flex: 1;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>💬 P2P Chat</h1>
                <div class="peer-id" id="peerId">Loading...</div>
            </div>

            <div class="peer-controls">
                <div class="control-group">
                    <input type="text" id="peerConnectInput" placeholder="Peer address (host:port)" />
                </div>
                <div class="control-group">
                    <button onclick="connectToPeer()">Connect</button>
                    <button onclick="discoverPeers()">Discover</button>
                </div>
            </div>

            <div class="status" id="status">Initializing...</div>

            <div class="peers-section">
                <div class="peers-header">Online Peers</div>
                <div class="peers-list" id="peersList">
                    <div style="color: #999; text-align: center; padding: 20px; font-size: 13px;">
                        No peers connected yet
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-dot"></div>
                <div class="chat-header-info">
                    <div class="chat-header-title" id="chatTitle">Welcome to P2P Chat</div>
                    <div class="chat-header-subtitle" id="chatSubtitle">Select a peer to start chatting</div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">👋</div>
                    <div>Select a peer to start chatting</div>
                </div>
            </div>

            <div class="input-container" id="inputContainer" style="display: none;">
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">
                        <span>Send</span>
                        <span>→</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // P2P Chat Client
        class P2PChat {
            constructor() {
                this.socket = io();
                this.peerId = this.generateId();
                this.connectedPeers = new Map();
                this.currentChat = null;
                this.messages = new Map();
                
                this.setupSocketListeners();
                this.setupUIListeners();
                this.updatePeerId();
                this.loadConnectionInfo();
            }

            generateId() {
                return 'peer-' + Math.random().toString(36).substr(2, 9);
            }

            setupSocketListeners() {
                this.socket.on('connect', () => {
                    console.log('Connected to signaling server');
                    this.updateStatus('Connected', 'connected');
                });

                this.socket.on('disconnect', () => {
                    console.log('Disconnected from signaling server');
                    this.updateStatus('Disconnected', 'error');
                });

                this.socket.on('peer-joined', (data) => {
                    console.log('Peer joined:', data.peerId);
                    this.addPeer(data.peerId, data.socketId);
                    this.showNotification(`${data.peerId} joined`);
                });

                this.socket.on('peer-left', (data) => {
                    console.log('Peer left');
                    this.removePeer(data.socketId);
                });

                this.socket.on('message', (data) => {
                    console.log('Message received:', data);
                    this.handleIncomingMessage(data);
                });

                this.socket.on('room-message', (data) => {
                    this.handleIncomingMessage(data);
                });

                this.socket.on('signal', (data) => {
                    console.log('Signal received from:', data.from);
                });
            }

            setupUIListeners() {
                document.getElementById('messageInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                const textarea = document.getElementById('messageInput');
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
                });
            }

            updatePeerId() {
                const peerIdEl = document.getElementById('peerId');
                peerIdEl.textContent = this.peerId;
                peerIdEl.title = 'Your Peer ID';
            }

            updateStatus(message, type) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = `status ${type}`;
            }

            loadConnectionInfo() {
                const saved = localStorage.getItem('p2p-connection-info');
                if (saved) {
                    const info = JSON.parse(saved);
                    document.getElementById('peerConnectInput').value = info.address || '';
                }
            }

            saveConnectionInfo() {
                const address = document.getElementById('peerConnectInput').value;
                localStorage.setItem('p2p-connection-info', JSON.stringify({ address }));
            }

            connectToPeer() {
                const input = document.getElementById('peerConnectInput').value.trim();
                if (!input) {
                    this.showNotification('Enter peer address', 'error');
                    return;
                }

                this.saveConnectionInfo();
                const [host, port] = input.split(':');
                
                if (!port) {
                    this.showNotification('Format: host:port', 'error');
                    return;
                }

                this.updateStatus('Connecting...', 'connecting');
                const peerId = `${host}:${port}`;
                this.addPeer(peerId, 'tcp-' + Math.random().toString(36).substr(2, 9));
                
                setTimeout(() => {
                    this.updateStatus('Connected', 'connected');
                    this.showNotification('Connected to peer');
                }, 500);
            }

            discoverPeers() {
                this.updateStatus('Discovering peers...', 'connecting');
                
                // Simulate peer discovery
                fetch('/api/peers')
                    .then(r => r.json())
                    .then(data => {
                        if (data.peers.length === 0) {
                            this.showNotification('No peers found');
                        } else {
                            data.peers.forEach(peer => {
                                this.addPeer(peer.id, peer.id);
                            });
                            this.showNotification(`Found ${data.peers.length} peers`);
                        }
                        this.updateStatus('Connected', 'connected');
                    })
                    .catch(err => {
                        console.error('Discovery error:', err);
                        this.updateStatus('Discovery failed', 'error');
                    });
            }

            addPeer(peerId, socketId) {
                if (this.connectedPeers.has(peerId)) return;
                
                this.connectedPeers.set(peerId, { id: peerId, socketId });
                this.messages.set(peerId, []);
                this.renderPeersList();
            }

            removePeer(socketId) {
                for (const [peerId, peer] of this.connectedPeers) {
                    if (peer.socketId === socketId) {
                        this.connectedPeers.delete(peerId);
                        if (this.currentChat === peerId) {
                            this.currentChat = null;
                            this.showEmptyState();
                        }
                        break;
                    }
                }
                this.renderPeersList();
            }

            renderPeersList() {
                const list = document.getElementById('peersList');
                
                if (this.connectedPeers.size === 0) {
                    list.innerHTML = '<div style="color: #999; text-align: center; padding: 20px; font-size: 13px;">No peers connected yet</div>';
                    return;
                }

                list.innerHTML = Array.from(this.connectedPeers.values()).map(peer => `
                    <div class="peer-item ${this.currentChat === peer.id ? 'active' : ''}" onclick="chat.selectPeer('${peer.id}')">
                        <div class="peer-status"></div>
                        <div class="peer-name">${peer.id}</div>
                    </div>
                `).join('');
            }

            selectPeer(peerId) {
                this.currentChat = peerId;
                this.renderPeersList();
                this.renderMessages();
                this.updateChatHeader();
                
                const inputContainer = document.getElementById('inputContainer');
                inputContainer.style.display = 'flex';
                
                document.getElementById('messageInput').focus();
            }

            updateChatHeader() {
                const title = document.getElementById('chatTitle');
                const subtitle = document.getElementById('chatSubtitle');
                
                title.textContent = this.currentChat || 'P2P Chat';
                subtitle.textContent = 'Connected and ready';
            }

            sendMessage() {
                if (!this.currentChat) {
                    this.showNotification('Select a peer first', 'error');
                    return;
                }

                const input = document.getElementById('messageInput');
                const content = input.value.trim();
                
                if (!content) return;

                const message = {
                    from: this.peerId,
                    to: this.currentChat,
                    content,
                    timestamp: Date.now(),
                    own: true
                };

                // Add to messages
                if (!this.messages.has(this.currentChat)) {
                    this.messages.set(this.currentChat, []);
                }
                this.messages.get(this.currentChat).push(message);

                // Send to peer
                this.socket.emit('message', {
                    to: this.connectedPeers.get(this.currentChat).socketId,
                    from: this.peerId,
                    content
                });

                this.renderMessages();
                input.value = '';
                input.style.height = 'auto';
            }

            handleIncomingMessage(data) {
                const from = data.from || data.peerId;
                
                if (!this.messages.has(from)) {
                    this.messages.set(from, []);
                }

                this.messages.get(from).push({
                    from,
                    content: data.content,
                    timestamp: data.timestamp || Date.now(),
                    own: false
                });

                if (this.currentChat === from) {
                    this.renderMessages();
                }

                this.showNotification(`Message from ${from}`);
            }

            renderMessages() {
                const container = document.getElementById('messagesContainer');
                
                if (!this.currentChat) {
                    this.showEmptyState();
                    return;
                }

                const messages = this.messages.get(this.currentChat) || [];

                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div>No messages yet. Start the conversation!</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = messages.map(msg => `
                    <div class="message ${msg.own ? 'own' : 'other'}">
                        <div>
                            <div class="message-bubble">${this.escapeHtml(msg.content)}</div>
                            <div class="message-time">${this.formatTime(msg.timestamp)}</div>
                        </div>
                    </div>
                `).join('');

                // Scroll to bottom
                container.scrollTop = container.scrollHeight;
            }

            showEmptyState() {
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👋</div>
                        <div>Select a peer to start chatting</div>
                    </div>
                `;
            }

            showNotification(message, type = 'info') {
                console.log(`[${type.toUpperCase()}]`, message);
                // Could add toast notification here
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatTime(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
            }
        }

        // Initialize
        let chat;
        document.addEventListener('DOMContentLoaded', () => {
            chat = new P2PChat();
        });

        // Global functions for onclick handlers
        function connectToPeer() {
            chat.connectToPeer();
        }

        function discoverPeers() {
            chat.discoverPeers();
        }

        function sendMessage() {
            chat.sendMessage();
        }
    </script>
</body>
</html>
