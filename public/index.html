<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 250px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-right: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: red;
        }

        .dot.green {
            background: #4ade80;
        }

        .my-id {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 15px;
            font-family: monospace;
        }

        .peers-list {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .peer-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 12px;
            word-break: break-all;
            transition: all 0.2s;
        }

        .peer-item:hover {
            background: #667eea;
            color: white;
        }

        .peer-item.active {
            background: #667eea;
            color: white;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 14px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.other {
            align-self: flex-start;
            background: #e5e7eb;
            color: #333;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-area button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>💬 Chat</h2>
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
        <div class="my-id" id="myId">Loading...</div>
        <div class="peers-list" id="peersList"></div>
    </div>

    <div class="chat">
        <div class="chat-header" id="chatHeader">Select a peer</div>
        <div class="messages" id="messages">
            <div class="empty">Select a peer to chat</div>
        </div>
        <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myId = null;
        let currentChat = null;
        let allPeers = [];
        const chatHistory = {};

        socket.on('connect', () => {
            console.log('Connected to server');
            updateStatus('Connected', true);
        });

        socket.on('your-id', (id) => {
            myId = id;
            document.getElementById('myId').textContent = 'ID: ' + id;
            console.log('My ID:', id);
        });

        socket.on('peers-update', (peers) => {
            allPeers = peers.filter(p => p !== myId);
            console.log('Peers:', allPeers);
            renderPeers();
        });

        socket.on('message', (data) => {
            console.log('Message received:', data);
            if (!chatHistory[data.from]) {
                chatHistory[data.from] = [];
            }
            chatHistory[data.from].push({
                from: data.from,
                text: data.text,
                own: false
            });

            if (currentChat === data.from) {
                renderMessages();
            }
        });

        socket.on('disconnect', () => {
            updateStatus('Disconnected', false);
            console.log('Disconnected');
        });

        socket.on('error', (error) => {
            console.error('Socket error:', error);
            updateStatus('Error: ' + error, false);
        });

        function updateStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            if (connected) {
                dot.classList.add('green');
            } else {
                dot.classList.remove('green');
            }
        }

        function renderPeers() {
            const list = document.getElementById('peersList');
            if (allPeers.length === 0) {
                list.innerHTML = '<div style="color: #999; font-size: 12px; padding: 10px;">No peers online</div>';
                return;
            }

            list.innerHTML = allPeers.map(peer => `
                <div class="peer-item ${currentChat === peer ? 'active' : ''}" onclick="selectPeer('${peer}')">
                    ${peer.substring(0, 8)}...
                </div>
            `).join('');
        }

        function selectPeer(peerId) {
            currentChat = peerId;
            document.getElementById('chatHeader').textContent = 'Chatting with ' + peerId.substring(0, 8) + '...';
            document.getElementById('inputArea').style.display = 'flex';
            if (!chatHistory[peerId]) {
                chatHistory[peerId] = [];
            }
            renderMessages();
            renderPeers();
            document.getElementById('msgInput').focus();
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            const messages = chatHistory[currentChat] || [];

            if (messages.length === 0) {
                container.innerHTML = '<div class="empty">No messages yet</div>';
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.own ? 'own' : 'other'}">
                    ${msg.text}
                </div>
            `).join('');

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();

            if (!text || !currentChat) return;

            socket.emit('message', {
                to: currentChat,
                text: text
            });

            if (!chatHistory[currentChat]) {
                chatHistory[currentChat] = [];
            }
            chatHistory[currentChat].push({
                from: myId,
                text: text,
                own: true
            });

            renderMessages();
            input.value = '';
            input.focus();
        }

        document.getElementById('msgInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
